name: CD — Production build verify

# branding/xone-website fork: production hosting is NOT GitHub Pages.
#   FrontEnd → Vercel  (Root Directory: FrontEnd, repo: branding/xone-website)
#   BackEnd  → Railway  (root: BackEnd, repo: branding/xone-website)
#
# Vercel and Railway deploy via their GitHub integrations on push to the connected branch.
# This workflow verifies a production-like FrontEnd build on deployment branches.
# Set repository variable VITE_API_BASE_URL to match your Railway API origin (optional).

on:
  push:
    branches:
      - main
      - branding/xone-website
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-production-build:
    name: FrontEnd — production build verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build (Vercel-like env)
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}

      - name: Deploy note
        run: |
          echo "Production deploy is handled by Vercel (FrontEnd) and Railway (BackEnd)."
          echo "See DEPLOY.md for dashboard setup and env wiring."
